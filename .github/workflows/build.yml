name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Installs Gradle itself, so no gradlew wrapper is needed in the repo.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # The ubuntu runner image already ships the Android SDK (ANDROID_HOME is set).
      - name: Unit tests (engine + games)
        run: gradle :core:engine:test :games:snake:test :games:bricks:test :games:dodge:test

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: lock-arcade-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
